<!-- ================================================
     components/navbar.html
     Navbar con autenticacion Flask-Login
================================================ -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">
    <div class="container">
        <a class="navbar-brand fw-bold text-info" href="/">🎨 Narvi Models</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuBase"
                aria-controls="menuBase"
                aria-expanded="false"
                aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuBase">
            <ul class="navbar-nav ms-auto gap-1">

                <li class="nav-item">
                    <a class="nav-link" href="/">🏠 Inicio</a>
                </li>

                {% if current_user.is_authenticated %}
                    <!-- Menú para usuarios autenticados -->
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">📊 Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/productos">📦 Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/clientes">👥 Clientes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/proveedores">🏭 Proveedores</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/facturacion">🧾 Facturación</a>
                    </li>
                    <li class="nav-item">
                        <span class="nav-link text-info fw-semibold">
                            👤 {{ current_user.usuario }}
                        </span>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-danger fw-semibold" href="/logout">
                            🚪 Cerrar Sesión
                        </a>
                    </li>
                {% else %}
                    <!-- Menú para usuarios no autenticados -->
                    <li class="nav-item">
                        <a class="nav-link" href="/login">🔐 Iniciar Sesión</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/registro">📝 Registrarse</a>
                    </li>
                {% endif %}

            </ul>
        </div>
    </div>
</nav>
